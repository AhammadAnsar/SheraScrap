name: Validate website
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:cloudflare
      - run: npm run deploy:check
      - name: Notify IndexNow after the matching production build is live
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        run: node scripts/indexnow.mjs --submit
