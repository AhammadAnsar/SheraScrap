<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Legacy Hash URL Migration (/#post-..., /#service-..., /#location-..., /#page-...) -->
    <script>
      (function() {
        try {
          var hash = window.location.hash;
          if (hash && hash.length > 1) {
            var raw = hash.replace(/^#\/?/, '');
            var target = '';
            if (raw.indexOf('post-') === 0) {
              var slug = raw.substring(5);
              if (slug === '1') slug = 'how-to-sell-scrap-dammam-best-price';
              else if (slug === '2') slug = 'copper-scrap-types-prices-dammam';
              else if (slug === 'v1') slug = 'copper-scrap-market-dammam-2026';
              else if (slug === 'v2') slug = 'how-to-sell-used-ac-scrap-dammam';
              target = '/ar/blog/' + slug + '/';
            } else if (raw.indexOf('service-') === 0) {
              var slug = raw.substring(8);
              target = '/ar/services/' + slug + '/';
            } else if (raw.indexOf('location-') === 0) {
              var slug = raw.substring(9);
              target = '/ar/locations/' + slug + '/';
            } else if (raw.indexOf('page-') === 0) {
              var slug = raw.substring(5);
              if (slug === 'about') target = '/ar/about/';
              else if (slug === 'contact') target = '/ar/contact/';
              else target = '/ar/pages/' + slug + '/';
            }
            if (target && target !== window.location.pathname) {
              window.history.replaceState(null, '', target);
              window.location.replace(target);
            }
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Server-Side Rendered Dynamic SEO, Canonical, OpenGraph & Structured Data (SSR) -->
    <!-- SSR_HEAD_INJECTION -->
    
    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shera Scrap" />

    <!-- Performance Preconnects for CDN & Fonts -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Arabic Fonts with font-display swap -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>" />
  </head>

</html>
