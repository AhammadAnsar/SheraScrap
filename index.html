<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Legacy Hash URL Migration (/#post-..., /#service-..., /#location-..., /#page-...) -->
    <script>
      (function() {
        try {
          var hash = window.location.hash;
          if (hash && hash.length > 1) {
            var raw = hash.replace(/^#\/?/, '');
            var target = '';
            if (raw.indexOf('post-') === 0) {
              var slug = raw.substring(5);
              if (slug === '1') slug = 'how-to-sell-scrap-dammam-best-price';
              else if (slug === '2') slug = 'copper-scrap-types-prices-dammam';
              else if (slug === 'v1') slug = 'copper-scrap-market-dammam-2026';
              else if (slug === 'v2') slug = 'how-to-sell-used-ac-scrap-dammam';
              target = '/ar/blog/' + slug + '/';
            } else if (raw.indexOf('service-') === 0) {
              var slug = raw.substring(8);
              target = '/ar/services/' + slug + '/';
            } else if (raw.indexOf('location-') === 0) {
              var slug = raw.substring(9);
              target = '/ar/locations/' + slug + '/';
            } else if (raw.indexOf('page-') === 0) {
              var slug = raw.substring(5);
              if (slug === 'about') target = '/ar/about/';
              else if (slug === 'contact') target = '/ar/contact/';
              else target = '/ar/pages/' + slug + '/';
            }
            if (target && target !== window.location.pathname) {
              window.history.replaceState(null, '', target);
              window.location.replace(target);
            }
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Server-Side Rendered Dynamic SEO, Canonical, OpenGraph & Structured Data (SSR) -->
    <!-- SSR_HEAD_INJECTION -->
    
    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#10364c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shera Scrap" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/resources/brand/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/resources/brand/icon-180.png" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/static/browser.ts"></script>
  </body>
</html>
